apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-frontend
  namespace: rill-bench
data:
  nginx.conf: |
    pid /tmp/nginx.pid;
    error_log /dev/stderr error;
    worker_processes 2;
    events { worker_connections 1024; }
    http {
        access_log off;
        sendfile on;
        client_body_temp_path /tmp/client;
        proxy_temp_path /tmp/proxy;
        fastcgi_temp_path /tmp/fastcgi;
        uwsgi_temp_path /tmp/uwsgi;
        scgi_temp_path /tmp/scgi;
        upstream api {
            server api-origin:8080;
            keepalive 128;
        }
        upstream downloads {
            server download-origin:8080;
            keepalive 128;
        }
        server {
            listen 8080;
            root /srv/fixtures;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host backend;
            proxy_buffering on;
            proxy_next_upstream off;
            location /api/ { proxy_pass http://api; }
            location /downloads/ { proxy_pass http://downloads; }
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: rill-bench
spec:
  replicas: 3
  selector:
    matchLabels:
      app: nginx
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: nginx
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        nodeTaintsPolicy: Honor
        matchLabelKeys:
        - pod-template-hash
        labelSelector:
          matchLabels:
            app: nginx
      volumes:
      - name: fixtures
        configMap:
          name: fixtures
          items:
          - key: static.bin
            path: static.bin
      - name: config
        configMap:
          name: nginx-frontend
      - name: scratch
        emptyDir:
          sizeLimit: 1Gi
      containers:
      - name: nginx
        image: docker.io/library/nginx@sha256:5fa52b9493ccae58b850274d6dcd64e4ec8cf6ab3d2db3120a3ea28aa01aef2a
        ports:
        - name: http
          containerPort: 8080
        readinessProbe:
          httpGet:
            path: /static.bin
            port: http
          periodSeconds: 2
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
        - name: fixtures
          mountPath: /srv/fixtures
          readOnly: true
        - name: config
          mountPath: /etc/bench
          readOnly: true
        - name: scratch
          mountPath: /tmp
        command: ["nginx", "-c", "/etc/bench/nginx.conf", "-g", "daemon off;"]
        resources:
          requests:
            cpu: '1'
            memory: 64Mi
          limits:
            cpu: '2'
            memory: 256Mi
  minReadySeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: nginx
  namespace: rill-bench
spec:
  selector:
    app: nginx
  ports:
  - name: http
    port: 8080
    targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: nginx
  namespace: rill-bench
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: rill
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nginx
  namespace: rill-bench
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  tls:
  - hosts:
    - nginx-bench
    secretName: nginx-bench-tls
  rules:
  - host: nginx-bench
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: nginx
            port:
              name: http
