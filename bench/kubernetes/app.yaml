apiVersion: apps/v1
kind: Deployment
metadata:
  name: rill
  namespace: rill-bench
spec:
  replicas: 3
  selector:
    matchLabels:
      app: rill
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: rill
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        nodeTaintsPolicy: Honor
        matchLabelKeys:
        - pod-template-hash
        labelSelector:
          matchLabels:
            app: rill
      volumes:
      - name: fixtures
        configMap:
          name: fixtures
          items:
          - key: static.bin
            path: static.bin
      containers:
      - name: rill
        image: ghcr.io/dperox/rill@sha256:b28cb931d5696b70fbd4d7b966d4ef8011eda3b0b0c5a3c98ad5a8edc7d84838
        ports:
        - name: http
          containerPort: 8080
        readinessProbe:
          httpGet:
            path: /static.bin
            port: http
          periodSeconds: 2
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
        - name: fixtures
          mountPath: /srv/fixtures
          readOnly: true
        env:
        - name: LISTEN
          value: 0.0.0.0:8080
        - name: DOCUMENT_ROOT
          value: /srv/fixtures
        - name: RILL_ASSET_CACHE_ENTRIES
          value: '0'
        - name: RILL_HEALTH_INTERVAL_SECS
          value: '2'
        - name: RILL_HEALTH_PATH
          value: /ready
        - name: RILL_ROUTES
          value: '[{"prefix":"/api/","upstreams":["api-origin:8080"]},{"prefix":"/downloads/","upstreams":["download-origin:8080"]}]'
        resources:
          requests:
            cpu: '1'
            memory: 64Mi
          limits:
            cpu: '2'
            memory: 256Mi
  minReadySeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: rill
  namespace: rill-bench
spec:
  selector:
    app: rill
  ports:
  - name: http
    port: 8080
    targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: rill
  namespace: rill-bench
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: rill
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rill
  namespace: rill-bench
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  tls:
  - hosts:
    - rill-bench
    secretName: rill-bench-tls
  rules:
  - host: rill-bench
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: rill
            port:
              name: http
