apiVersion: v1
kind: ConfigMap
metadata:
  name: origin-nginx
  namespace: rill-bench
data:
  nginx.conf: |-
    pid /tmp/nginx.pid;
    error_log /dev/stderr warn;
    worker_processes 1;
    events { worker_connections 1024; }
    http {
        access_log off;
        sendfile on;
        client_body_temp_path /tmp/client;
        proxy_temp_path /tmp/proxy;
        fastcgi_temp_path /tmp/fastcgi;
        uwsgi_temp_path /tmp/uwsgi;
        scgi_temp_path /tmp/scgi;
        server {
            listen 8080;
            root /srv/fixtures;
            add_header X-Bench-Origin $hostname;
            location = /ready { return 200 "ready"; }
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-origin
  namespace: rill-bench
spec:
  replicas: 3
  selector:
    matchLabels:
      app: api-origin
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: api-origin
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        nodeTaintsPolicy: Honor
        matchLabelKeys:
        - pod-template-hash
        labelSelector:
          matchLabels:
            app: api-origin
      volumes:
      - name: fixtures
        configMap:
          name: fixtures
          items:
          - key: api.bin
            path: api/payload.bin
      - name: nginx-config
        configMap:
          name: origin-nginx
      containers:
      - name: api-origin
        image: docker.io/library/nginx@sha256:5fa52b9493ccae58b850274d6dcd64e4ec8cf6ab3d2db3120a3ea28aa01aef2a
        ports:
        - name: http
          containerPort: 8080
        readinessProbe:
          httpGet:
            path: /ready
            port: http
          periodSeconds: 2
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: fixtures
          mountPath: /srv/fixtures
          readOnly: true
        - name: nginx-config
          mountPath: /etc/bench
          readOnly: true
        command:
        - nginx
        - -c
        - /etc/bench/nginx.conf
        - -g
        - daemon off;
        resources:
          requests:
            cpu: 250m
            memory: 32Mi
          limits:
            cpu: '1'
            memory: 96Mi
---
apiVersion: v1
kind: Service
metadata:
  name: api-origin
  namespace: rill-bench
spec:
  selector:
    app: api-origin
  ports:
  - name: http
    port: 8080
    targetPort: http
---
