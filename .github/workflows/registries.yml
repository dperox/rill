name: Publish to external registries
on:
  workflow_dispatch:
    inputs:
      registry:
        description: Registry to publish the selected release tag to
        type: choice
        options: [crates.io, Docker Hub]
        required: true

permissions:
  contents: read
  packages: read

jobs:
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Verify release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          latest=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml","rb"))["package"]["version"])')
          [[ "$latest" == "$GITHUB_REF_NAME" && "$latest" == "v$version" ]]
      - name: Publish crate
        if: inputs.registry == 'crates.io'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          rustup update stable --no-self-update
          cargo +stable publish --locked
      - name: Copy verified multi-platform image
        if: inputs.registry == 'Docker Hub'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y skopeo
          printf '%s' "$GH_TOKEN" | skopeo login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          printf '%s' "$DOCKERHUB_TOKEN" | skopeo login docker.io -u dperox --password-stdin
          src=docker://ghcr.io/dperox/japka
          dst=docker://docker.io/dperox/japka
          digest=$(skopeo inspect --format '{{.Digest}}' "$src:latest")
          skopeo inspect --raw "$src@$digest" | jq -e '[.manifests[].platform.architecture] | contains(["amd64","arm64"])'
          revision=$(skopeo inspect "$src@$digest" | jq -er '.Labels["org.opencontainers.image.revision"]')
          [[ "$revision" == "$GITHUB_SHA" ]]
          skopeo copy --all --preserve-digests "$src@$digest" "$dst:latest"
          [[ "$(skopeo inspect --format '{{.Digest}}' "$dst:latest")" == "$digest" ]]
