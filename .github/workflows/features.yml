name: Japka feature checks
on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: features-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Select OpenSSL on macOS
        if: runner.os == 'macOS'
        run: echo "$(brew --prefix openssl@3)/bin" >> "$GITHUB_PATH"
      - name: Check Rust
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup component add rustfmt clippy
          cargo fmt --check
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --locked
      - name: Run feature acceptance checks
        run: |
          cargo build --locked
          python3 checks/reload.py
          python3 checks/shared_listener.py
          python3 checks/websocket.py
          python3 checks/sites.py
          python3 checks/edge_routing.py
          python3 checks/migration.py
          python3 checks/config_review.py
      - name: Check routing, static I/O, streams, policies and security regressions
        run: |
          python3 checks/routing.py
          python3 checks/upstreams.py
          python3 checks/proxy_failure.py
          python3 checks/policy.py
          python3 checks/static_sizes.py
          python3 checks/static_updates.py
          python3 checks/http1_buffers.py
          python3 checks/proxy_streaming.py
          python3 checks/mixed_io.py
          python3 checks/streams.py target/debug/japka
          python3 checks/security.py
      - name: Check opt-in fixed upstreams through reloads and middleware
        env:
          JAPKA_FIXED_UPSTREAM: "1"
        run: |
          python3 checks/reload.py
          python3 checks/policy.py
          python3 checks/websocket.py
          python3 checks/proxy_streaming.py
      - name: Check Linux sendfile and asset cache
        if: runner.os == 'Linux'
        run: |
          python3 checks/sendfile.py
          python3 checks/asset_cache.py
      - name: Smoke-test the end-to-end performance suite
        if: runner.os == 'Linux'
        run: |
          cargo fmt --manifest-path perf/Cargo.toml --check
          cargo build --manifest-path perf/Cargo.toml --release --locked
          python3 perf/run.py --japka target/debug/japka --smoke
      - name: Smoke-test the macOS ARM64 release archive
        if: runner.os == 'macOS'
        run: |
          ./deploy/package-macos.sh arm64 "$RUNNER_TEMP/dist"
          cd "$RUNNER_TEMP/dist"
          shasum -a 256 -c *.sha256
          tar -xzf *.tar.gz
          cd japka
          ./japka config test
