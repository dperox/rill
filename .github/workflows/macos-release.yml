name: Release macOS binaries
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: amd64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Package and preflight release
        run: ./deploy/package-macos.sh "$ARCH" "$RUNNER_TEMP/dist"
      - name: Attach archive and checksum
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$RELEASE_TAG" "$RUNNER_TEMP"/dist/*
