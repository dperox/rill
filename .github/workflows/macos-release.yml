name: Release macOS binaries
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: amd64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Update stable Rust toolchain
        run: |
          rustup update stable --no-self-update
          rustup default stable
      - name: Package and preflight release
        run: ./deploy/package-macos.sh "$ARCH" "$RUNNER_TEMP/dist"
      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rill-macos-${{ matrix.arch }}
          path: ${{ runner.temp }}/dist/*
          if-no-files-found: error

  publish:
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: rill-macos-*
          path: ${{ runner.temp }}/dist
          merge-multiple: true
      - name: Verify checksums and attach to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/dist"
          for file in *.sha256; do
            sha256sum -c "$file"
          done
          gh release upload "$RELEASE_TAG" ./* --clobber
