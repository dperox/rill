name: Release binaries
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: amd64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Update stable Rust toolchain
        run: |
          rustup update stable --no-self-update
          rustup default stable
      - name: Package and preflight release
        run: ./deploy/package-macos.sh "$ARCH" "$RUNNER_TEMP/dist"
      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: japka-release-macos-${{ matrix.arch }}
          path: ${{ runner.temp }}/dist/*
          if-no-files-found: error

  portable:
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      matrix:
        runner: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build, preflight and package the binary
        shell: bash
        run: |
          set -euo pipefail
          rustup update stable --no-self-update
          cargo +stable build --locked --release
          version=${GITHUB_REF_NAME#v}
          if [[ "$RUNNER_OS" == Linux ]]; then cargo +stable package --locked; fi
          stage=dist/japka
          mkdir -p "$stage"
          cp -R public notices README.md LICENSE "$stage/"
          if [[ "$RUNNER_OS" == Windows ]]; then
            cp target/release/japka.exe "$stage/"
            (cd "$stage" && ./japka.exe config test && [[ "$(./japka.exe --version)" == "japka $version" ]])
            (cd dist && 7z a -tzip "japka-$version-windows-amd64.zip" japka)
          else
            cp target/release/japka "$stage/"
            (cd "$stage" && ./japka config test && [[ "$(./japka --version)" == "japka $version" ]])
            tar -C dist -czf "dist/japka-$version-linux-amd64.tar.gz" japka
            cp "target/package/japka-$version.crate" dist/
            sed 's|image: japka:local|image: ghcr.io/japka-rs/japka:latest|' deploy/kubernetes.yaml > dist/kubernetes.yaml
          fi
          rm -r "$stage"
          (cd dist && for file in *; do sha256sum "$file" > "$file.sha256"; done)
      - uses: actions/upload-artifact@v4
        with:
          name: japka-release-${{ runner.os }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: [package, portable]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: japka-release-*
          path: ${{ runner.temp }}/dist
          merge-multiple: true
      - name: Verify checksums and attach to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/dist"
          for file in *.sha256; do
            sha256sum -c "$file"
          done
          gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" ./* --clobber
